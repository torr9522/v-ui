{{define "form/inbound"}}
<a-alert
        type="info"
        show-icon
        style="margin-bottom: 16px;"
        :message="inboundSummary()"
        description="当前弹窗只重组布局与说明，不改变保存字段或提交 payload。">
</a-alert>

<a-tabs :active-key="inModal.activeTab" @change="key => inModal.activeTab = key">
    <a-tab-pane key="basic" tab="Basic">
        <a-form layout="vertical">
            <a-row :gutter="16">
                <a-col :xs="24" :sm="12">
                    <a-form-item label='{{ i18n "remark" }}'>
                        <a-input v-model.trim="dbInbound.remark" placeholder="例如：office-vless"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="6">
                    <a-form-item label='{{ i18n "enable" }}'>
                        <a-switch v-model="dbInbound.enable"></a-switch>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="6">
                    <a-form-item label='{{ i18n "protocol" }}'>
                        <a-select v-model="inbound.protocol">
                            <a-select-option v-for="p in protocolOptions" :key="p.value" :value="p.value">[[ p.label ]]</a-select-option>
                        </a-select>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            监听 IP
                            <a-tooltip>
                                <template slot="title">
                                    留空表示监听全部地址。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input v-model.trim="inbound.listen" placeholder="例如：0.0.0.0，留空监听全部"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="12">
                    <a-form-item label="端口">
                        <a-input type="number" v-model.number="inbound.port" placeholder="例如：443"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-alert
                    type="warning"
                    show-icon
                    message="这里只放最常用字段。流量限制、到期时间、兼容项等已移到 Advanced。">
            </a-alert>
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="protocol" tab="Client / Protocol">
        <a-form layout="vertical">
            <a-alert
                    type="info"
                    show-icon
                    style="margin-bottom: 16px;"
                    message="这里配置协议相关字段与客户端凭据。"
                    description="不会改变协议保存结构，只是把原有字段从平铺表单中整理出来。">
            </a-alert>

            <template v-if="inbound.protocol === Protocols.VMESS">
                {{template "form/vmess"}}
            </template>

            <template v-if="inbound.protocol === Protocols.VLESS">
                {{template "form/vless"}}
            </template>

            <template v-if="inbound.protocol === Protocols.TROJAN">
                {{template "form/trojan"}}
            </template>

            <template v-if="inbound.protocol === Protocols.SHADOWSOCKS">
                {{template "form/shadowsocks"}}
            </template>

            <template v-if="inbound.protocol === Protocols.DOKODEMO">
                {{template "form/dokodemo"}}
            </template>

            <template v-if="inbound.protocol === Protocols.SOCKS">
                {{template "form/socks"}}
            </template>

            <template v-if="inbound.protocol === Protocols.HTTP">
                {{template "form/http"}}
            </template>

            <template v-if="inbound.protocol === Protocols.MIXED">
                {{template "form/mixed"}}
            </template>

            <template v-if="inbound.protocol === Protocols.TUNNEL">
                {{template "form/tunnel"}}
            </template>
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="transport" tab="Transport" v-if="inbound.canEnableStream() || inbound.protocol === Protocols.TROJAN">
        <a-form layout="vertical">
            <a-alert
                    type="info"
                    show-icon
                    style="margin-bottom: 16px;"
                    message="Transport 只重组现有字段。内部值保持不变，例如 RAW 仍保存为 tcp。"
                    description="HTTP、mKCP、QUIC 仍保留兼容编辑能力。">
            </a-alert>
            {{template "form/streamSettings"}}
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="security" tab="Security" v-if="inbound.canEnableTls() || inbound.protocol === Protocols.TROJAN">
        <a-form layout="vertical">
            <a-alert
                    type="info"
                    show-icon
                    style="margin-bottom: 16px;"
                    message="这里统一管理 TLS / XTLS 与证书。"
                    description="如果当前面板已安装证书，TLS 区域会优先提示并可自动填入证书路径。">
            </a-alert>
            {{template "form/tlsSettings"}}
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="sniffing" tab="Sniffing" v-if="inbound.canSniffing()">
        <a-form layout="vertical">
            <a-alert
                    type="info"
                    show-icon
                    style="margin-bottom: 16px;"
                    message="Sniffing 影响流量识别与路由命中。"
                    description="只展示已有数据字段，不新增后端行为。">
            </a-alert>
            {{template "form/sniffing"}}
        </a-form>
    </a-tab-pane>

    <a-tab-pane key="advanced" tab="Advanced">
        <a-form layout="vertical">
            <a-alert
                    type="warning"
                    show-icon
                    style="margin-bottom: 16px;"
                    message="Advanced / Compatibility"
                    description="这里保留低频字段与兼容项。不会删除旧字段，也不会改变已有配置的保存方式。">
            </a-alert>
            <a-row :gutter="16">
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            总流量(GB)
                            <a-tooltip>
                                <template slot="title">
                                    0 表示不限制。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input-number v-model="dbInbound.totalGB" :min="0" style="width: 100%;"></a-input-number>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            到期时间
                            <a-tooltip>
                                <template slot="title">
                                    留空则永不到期。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                                       v-model="dbInbound._expiryTime" style="width: 100%;"></a-date-picker>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            IP 限制
                            <a-tooltip>
                                <template slot="title">
                                    0 表示不限制，1 表示仅允许一个源 IP。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input-number v-model="dbInbound.ipLimit" :min="0" :max="500" style="width: 100%;"></a-input-number>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            超额封禁(分钟)
                            <a-tooltip>
                                <template slot="title">
                                    超过 IP 限制后，端口封禁 N 分钟后自动恢复。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input-number v-model="dbInbound._ipTimeout" :min="1" :max="1440" style="width: 100%;"></a-input-number>
                    </a-form-item>
                </a-col>
            </a-row>
            <a-row :gutter="16">
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            Port 速率
                            <a-tooltip>
                                <template slot="title">
                                    格式: 50mbit / 500kbps / 10mbyte。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input v-model.trim="dbInbound._portRate" placeholder="例如：50mbit / 500kbps / 10mbyte"></a-input>
                    </a-form-item>
                </a-col>
                <a-col :xs="24" :sm="12">
                    <a-form-item>
                        <span slot="label">
                            IP 速率
                            <a-tooltip>
                                <template slot="title">
                                    格式: 50mbit / 500kbps / 10mbyte。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-input v-model.trim="dbInbound._ipRate" placeholder="例如：5mbit / 200kbps / 1mbyte"></a-input>
                    </a-form-item>
                </a-col>
            </a-row>

            <a-alert v-if="inbound.xtls"
                    type="warning"
                    show-icon
                    style="margin-top: 12px;"
                    message="XTLS 仍保留兼容编辑能力"
                    description="建议仅为旧配置保持兼容使用。新建节点请优先使用 TLS 相关主线方案。">
            </a-alert>
            <a-alert v-if="inbound.stream.network === 'http'"
                    type="warning"
                    show-icon
                    style="margin-top: 12px;"
                    message="旧 HTTP transport 仍保留兼容编辑能力">
            </a-alert>
            <a-alert v-if="inbound.stream.network === 'kcp' || inbound.stream.network === 'quic'"
                    type="warning"
                    show-icon
                    style="margin-top: 12px;"
                    message="mKCP / QUIC 当前作为 legacy / compatibility 保留，请谨慎继续扩展。">
            </a-alert>
        </a-form>
    </a-tab-pane>
</a-tabs>
{{end}}
