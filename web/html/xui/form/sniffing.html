{{define "form/sniffing"}}
<a-form layout="vertical">
    <a-form-item>
        <span slot="label">
            sniffing
            <a-tooltip>
                <template slot="title">
                    开启后可按协议特征识别流量。
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-switch v-model="inbound.sniffing.enabled"></a-switch>
    </a-form-item>
    <a-form-item v-if="inbound.sniffing.enabled" label="destOverride">
        <a-select v-model="inbound.sniffing.destOverride" mode="multiple" style="width: 100%;">
            <a-select-option value="http">http</a-select-option>
            <a-select-option value="tls">tls</a-select-option>
            <a-select-option value="quic">quic</a-select-option>
            <a-select-option value="fakedns">fakedns</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item v-if="inbound.sniffing.enabled" label="metadataOnly">
        <a-switch v-model="inbound.sniffing.metadataOnly"></a-switch>
    </a-form-item>
    <a-form-item v-if="inbound.sniffing.enabled" label="routeOnly">
        <a-switch v-model="inbound.sniffing.routeOnly"></a-switch>
    </a-form-item>
</a-form>
{{end}}
