{{define "form/vmess"}}
<a-alert
        type="warning"
        show-icon
        style="margin-bottom: 12px;"
        message="alterId 为兼容旧 VMess 配置保留"
        description="Xray 26.5.3 主线下不建议继续为新节点依赖该字段。">
</a-alert>
<a-form layout="vertical">
    <a-form-item label="id">
        <a-input v-model.trim="inbound.settings.vmesses[0].id" placeholder="客户端 UUID"></a-input>
    </a-form-item>
    <a-form-item label="额外 ID (Deprecated)">
        <a-input type="number" v-model.number="inbound.settings.vmesses[0].alterId" placeholder="默认 0"></a-input>
    </a-form-item>
    <a-form-item label="禁用不安全加密">
        <a-switch v-model.number="inbound.settings.disableInsecure"></a-switch>
    </a-form-item>
</a-form>
{{end}}
