{{define "form/streamSettings"}}
<a-form layout="vertical">
    <a-form-item label="传输">
        <a-select :value="currentTransportSelection()" @change="applyTransportSelection">
            <a-select-option v-for="option in transportOptions" :key="option.value" :value="option.value">
                [[ formatTransportOption(option) ]]
            </a-select-option>
        </a-select>
    </a-form-item>
    <a-alert
            v-if="hasLegacyTransport(inbound.stream.network)"
            type="warning"
            show-icon
            style="margin-bottom: 12px;"
            :message="`${transportDisplayName(inbound.stream.network)} is kept for compatibility only.`">
    </a-alert>
    <a-alert
            type="info"
            show-icon
            style="margin-bottom: 12px;"
            message="XHTTP is planned for next phase."
            description="This build only provides the modern transport label shell. Selecting XHTTP will not change the saved network value yet.">
    </a-alert>
</a-form>

<template v-if="inbound.stream.network === 'tcp'">
    {{template "form/streamTCP"}}
</template>

<template v-if="inbound.stream.network === 'ws'">
    {{template "form/streamWS"}}
</template>

<template v-if="inbound.stream.network === 'grpc'">
    {{template "form/streamGRPC"}}
</template>

<template v-if="inbound.stream.network === 'http'">
    {{template "form/streamHTTP"}}
</template>

<template v-if="inbound.stream.network === 'kcp'">
    {{template "form/streamKCP"}}
</template>

<template v-if="inbound.stream.network === 'quic'">
    {{template "form/streamQUIC"}}
</template>
{{end}}
