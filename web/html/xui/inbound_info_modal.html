{{define "inboundInfoModal"}}
{{template "component/inboundInfo"}}
<a-modal id="inbound-info-modal" v-model="infoModal.visible" title="详细信息" @ok="infoModal.ok"
         :closable="true" :mask-closable="true"
         ok-text="复制链接" cancel-text='{{ i18n "close" }}' :ok-button-props="infoModal.okBtnPros">
    <div v-if="dbInbound.hasLink()" style="margin-bottom: 16px;">
        <a-alert
                type="info"
                show-icon
                style="margin-bottom: 12px;"
                message="自定义分享地址"
                description="留空则使用原始地址。只影响临时复制的分享链接，不影响原始链接、节点配置或订阅。">
        </a-alert>
        <a-row :gutter="8">
            <a-col :span="18">
                <a-input v-model.trim="infoModal.customShareAddress" placeholder="例如：edge.example.com 或 1.2.3.4"></a-input>
            </a-col>
            <a-col :span="6">
                <a-button id="inbound-info-modal-custom-copy-btn" type="primary" block @click="infoModal.copyCustomLink()">
                    复制自定义分享链接
                </a-button>
            </a-col>
        </a-row>
    </div>
    <inbound-info :db-inbound="dbInbound" :inbound="inbound"></inbound-info>
</a-modal>
<script>

    const infoModal = {
        visible: false,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        clipboard: null,
        customShareAddress: '',
        okBtnPros: {
            attrs: {
                id: "inbound-info-modal-ok-btn",
                style: "",
            },
        },
        show(dbInbound) {
            this.inbound = dbInbound.toInbound();
            this.dbInbound = new DBInbound(dbInbound);
            this.customShareAddress = '';
            this.visible = true;

            if (dbInbound.hasLink()) {
                this.okBtnPros.attrs.style = "";
            } else {
                this.okBtnPros.attrs.style = "display: none";
            }

            if (this.clipboard == null) {
                infoModalApp.$nextTick(() => {
                    this.clipboard = new ClipboardJS(`#${this.okBtnPros.attrs.id}`, {
                        text: () => this.dbInbound.genLink(),
                    });
                    this.clipboard.on('success', () => app.$message.success('复制成功'));
                });
            }
        },
        copyText(text) {
            const value = String(text || '');
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                return navigator.clipboard.writeText(value);
            }
            const textarea = document.createElement('textarea');
            textarea.value = value;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'absolute';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            return Promise.resolve();
        },
        copyCustomLink() {
            const error = Inbound.getCustomShareAddressError(this.customShareAddress);
            if (error !== '') {
                app.$message.warning(error);
                return;
            }
            this.copyText(this.dbInbound.genLink(this.customShareAddress))
                .then(() => app.$message.success('复制成功'))
                .catch(() => app.$message.error('复制失败'));
        },
        close() {
            infoModal.visible = false;
        },
    };

    const infoModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-info-modal',
        data: {
            infoModal,
            get dbInbound() {
                return this.infoModal.dbInbound;
            },
            get inbound() {
                return this.infoModal.inbound;
            }
        },
    });

</script>
{{end}}
