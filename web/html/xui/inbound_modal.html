{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}' width="1080px">
    {{template "form/inbound"}}
</a-modal>
<script>
    let inModalApp = null;

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        activeTab: 'basic',
        confirm: null,
        usableCertificates: [],
        usableCertificatesLoading: false,
        tlsAutoFillNotice: '',
        lastAutoAppliedCertFile: '',
        lastAutoAppliedKeyFile: '',
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            this.activeTab = 'basic';
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.usableCertificates = [];
            this.usableCertificatesLoading = false;
            this.tlsAutoFillNotice = '';
            this.lastAutoAppliedCertFile = '';
            this.lastAutoAppliedKeyFile = '';
            this.confirm = confirm;
            if (inModalApp) {
                inModalApp.ensureTlsCertificateModel();
                inModalApp.ensureSniffingModel();
            }
            this.visible = true;
            if (inModalApp && (this.inbound.tls || this.inbound.xtls)) {
                inModalApp.ensureUsableCertificates();
            }
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        TROJAN: Protocols.TROJAN,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        DOKODEMO: Protocols.DOKODEMO,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
        MIXED: Protocols.MIXED,
        TUNNEL: Protocols.TUNNEL,
    };

    const protocolOptions = [
        { value: Protocols.VMESS, label: 'VMess' },
        { value: Protocols.VLESS, label: 'VLESS' },
        { value: Protocols.TROJAN, label: 'Trojan' },
        { value: Protocols.SHADOWSOCKS, label: 'Shadowsocks' },
        { value: Protocols.DOKODEMO, label: 'Dokodemo-door' },
        { value: Protocols.SOCKS, label: 'SOCKS' },
        { value: Protocols.HTTP, label: 'HTTP' },
        { value: Protocols.MIXED, label: 'Mixed' },
        { value: Protocols.TUNNEL, label: 'Tunnel' },
    ];

    const transportOptions = [
        { value: 'tcp', label: 'RAW' },
        { value: 'ws', label: 'WebSocket' },
        { value: 'grpc', label: 'gRPC' },
        { value: 'http', label: 'HTTP Legacy', hint: 'Deprecated / Compatibility' },
        { value: 'kcp', label: 'mKCP Legacy', hint: 'Deprecated / Compatibility' },
        { value: 'quic', label: 'QUIC Legacy', hint: 'Deprecated / Compatibility' },
        { value: 'xhttp', label: 'XHTTP', hint: 'Coming Soon / Not enabled in this build' },
    ];

    inModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            protocolOptions: protocolOptions,
            transportOptions: transportOptions
        },
        methods: {
            ensureTlsCertificateModel() {
                if (!this.inbound.stream.tls) {
                    this.$set(this.inbound.stream, 'tls', new TlsStreamSettings());
                }
                if (!Array.isArray(this.inbound.stream.tls.certs)) {
                    this.$set(this.inbound.stream.tls, 'certs', []);
                }
                if (!this.inbound.stream.tls.certs[0]) {
                    this.$set(this.inbound.stream.tls.certs, 0, new TlsStreamSettings.Cert());
                }
                const cert = this.inbound.stream.tls.certs[0];
                if (typeof cert.useFile === 'undefined') {
                    this.$set(cert, 'useFile', true);
                }
                if (typeof cert.certFile === 'undefined') {
                    this.$set(cert, 'certFile', '');
                }
                if (typeof cert.keyFile === 'undefined') {
                    this.$set(cert, 'keyFile', '');
                }
                if (typeof cert.cert === 'undefined') {
                    this.$set(cert, 'cert', '');
                }
                if (typeof cert.key === 'undefined') {
                    this.$set(cert, 'key', '');
                }
                return cert;
            },
            ensureSniffingModel() {
                if (!this.inbound.sniffing) {
                    this.$set(this.inbound, 'sniffing', new Sniffing());
                }
                if (!Array.isArray(this.inbound.sniffing.destOverride)) {
                    this.$set(this.inbound.sniffing, 'destOverride', ['http', 'tls']);
                }
                if (typeof this.inbound.sniffing.enabled === 'undefined') {
                    this.$set(this.inbound.sniffing, 'enabled', false);
                }
                if (typeof this.inbound.sniffing.metadataOnly === 'undefined') {
                    this.$set(this.inbound.sniffing, 'metadataOnly', false);
                }
                if (typeof this.inbound.sniffing.routeOnly === 'undefined') {
                    this.$set(this.inbound.sniffing, 'routeOnly', false);
                }
                return this.inbound.sniffing;
            },
            currentTlsCertificate() {
                return this.ensureTlsCertificateModel();
            },
            transportDisplayName(network) {
                switch (network) {
                    case 'tcp':
                        return 'RAW';
                    case 'xhttp':
                        return 'XHTTP';
                    case 'http':
                        return 'HTTP Legacy';
                    case 'kcp':
                        return 'mKCP Legacy';
                    case 'quic':
                        return 'QUIC Legacy';
                    case 'ws':
                        return 'WebSocket';
                    case 'grpc':
                        return 'gRPC';
                    default:
                        return network || 'None';
                }
            },
            securityDisplayName() {
                if (this.inbound.xtls) {
                    return 'XTLS Legacy';
                }
                if (this.inbound.tls) {
                    return 'TLS';
                }
                return 'None';
            },
            currentTransportSelection() {
                return this.inbound.stream.network || 'tcp';
            },
            applyTransportSelection(selected) {
                if (selected === 'xhttp') {
                    this.$message.info('XHTTP support is planned for next phase');
                    return;
                }
                this.inbound.stream.network = selected;
            },
            formatTransportOption(option) {
                if (!option || !option.hint) {
                    return option ? option.label : '';
                }
                return `${option.label} (${option.hint})`;
            },
            currentSecurityMode() {
                if (this.inbound.xtls) {
                    return 'xtls';
                }
                if (this.inbound.tls) {
                    return 'tls';
                }
                return 'none';
            },
            securityOptions() {
                const options = [
                    { value: 'none', label: 'None' },
                    { value: 'tls', label: 'TLS' },
                ];
                if (this.inbound.canEnableXTls() || this.inbound.xtls) {
                    options.push({
                        value: 'xtls',
                        label: 'XTLS Legacy',
                        hint: 'Deprecated / Compatibility',
                    });
                }
                options.push({
                    value: 'reality',
                    label: 'REALITY',
                    hint: 'Coming Soon / Not enabled in this build',
                });
                return options;
            },
            applySecurityMode(selected) {
                switch (selected) {
                    case 'none':
                        this.inbound.tls = false;
                        this.inbound.xtls = false;
                        return;
                    case 'tls':
                        this.inbound.xtls = false;
                        this.inbound.tls = true;
                        return;
                    case 'xtls':
                        if (!this.inbound.canEnableXTls() && !this.inbound.xtls) {
                            this.$message.warning('XTLS is only available for compatibility on VLESS/Trojan over RAW(TCP)');
                            return;
                        }
                        this.inbound.tls = false;
                        this.inbound.xtls = true;
                        return;
                    case 'reality':
                        this.$message.info('REALITY support is planned for next phase');
                        return;
                    default:
                        return;
                }
            },
            hasVisionFlowField() {
                return this.inbound.protocol === Protocols.VLESS &&
                    this.inbound.settings &&
                    this.inbound.settings.vlesses &&
                    this.inbound.settings.vlesses[0] &&
                    (this.inbound.xtls || String(this.inbound.settings.vlesses[0].flow || '').trim() !== '');
            },
            inboundSummary() {
                const protocol = String(this.inbound.protocol || '').toUpperCase() || 'INBOUND';
                const parts = [protocol];
                if ((this.inbound.canEnableStream && this.inbound.canEnableStream()) || this.inbound.protocol === Protocols.TROJAN) {
                    parts.push(this.transportDisplayName(this.inbound.stream.network));
                }
                parts.push(this.securityDisplayName());
                return parts.join(' + ');
            },
            usableCertificates() {
                return Array.isArray(this.inModal.usableCertificates) ? this.inModal.usableCertificates : [];
            },
            selectedUsableCertificate() {
                const cert = this.currentTlsCertificate();
                const certFile = String(cert.certFile || '').trim();
                const keyFile = String(cert.keyFile || '').trim();
                if (!certFile || !keyFile) {
                    return null;
                }
                return this.usableCertificates().find(item =>
                    String(item.certFile || '').trim() === certFile &&
                    String(item.keyFile || '').trim() === keyFile
                ) || null;
            },
            shouldShowUsableCertificateSelect() {
                const cert = this.currentTlsCertificate();
                return this.usableCertificates().length > 1 &&
                    cert.useFile &&
                    (this.inbound.tls || this.inbound.xtls);
            },
            hasTLSAutoFillNotice() {
                if (!this.inModal.tlsAutoFillNotice) {
                    return false;
                }
                const cert = this.currentTlsCertificate();
                return String(cert.certFile || '').trim() === this.inModal.lastAutoAppliedCertFile &&
                    String(cert.keyFile || '').trim() === this.inModal.lastAutoAppliedKeyFile;
            },
            shouldAutoApplyUsableCertificate(certificate) {
                if (!certificate) {
                    return false;
                }
                const cert = this.currentTlsCertificate();
                const currentCertFile = String(cert.certFile || '').trim();
                const currentKeyFile = String(cert.keyFile || '').trim();
                if (currentCertFile === '' && currentKeyFile === '') {
                    return true;
                }
                return currentCertFile === this.inModal.lastAutoAppliedCertFile &&
                    currentKeyFile === this.inModal.lastAutoAppliedKeyFile;
            },
            applyUsableCertificate(certificate, options={}) {
                if (!certificate) {
                    return;
                }
                const auto = !!options.auto;
                const cert = this.currentTlsCertificate();
                this.$set(cert, 'useFile', true);
                this.$set(cert, 'certFile', certificate.certFile || '');
                this.$set(cert, 'keyFile', certificate.keyFile || '');
                if (!String(this.inbound.stream.tls.server || '').trim() && String(certificate.domain || '').trim()) {
                    this.$set(this.inbound.stream.tls, 'server', certificate.domain);
                }
                if (auto) {
                    this.inModal.lastAutoAppliedCertFile = certificate.certFile;
                    this.inModal.lastAutoAppliedKeyFile = certificate.keyFile;
                    this.inModal.tlsAutoFillNotice = '已自动使用当前面板证书。';
                } else {
                    this.inModal.tlsAutoFillNotice = '';
                }
            },
            async loadUsableCertificates(autofill=false) {
                const vm = inModalApp || this;
                const cert = vm.currentTlsCertificate();
                if (!cert.useFile || !(this.inbound.tls || this.inbound.xtls)) {
                    vm.inModal.usableCertificates = [];
                    vm.inModal.usableCertificatesLoading = false;
                    return;
                }
                vm.inModal.usableCertificatesLoading = true;
                const msg = await HttpUtil.post('/xui/cert/listUsable');
                vm.inModal.usableCertificatesLoading = false;
                if (!msg.success || !Array.isArray(msg.obj)) {
                    vm.inModal.usableCertificates = [];
                    return;
                }
                vm.inModal.usableCertificates = msg.obj;
                if (autofill && typeof vm.autoApplyUsableCertificate === 'function') {
                    vm.autoApplyUsableCertificate();
                }
            },
            applyUsableCertificateByID(id) {
                const certificate = this.usableCertificates().find(item => item.id === id);
                this.applyUsableCertificate(certificate, { auto: false });
            },
            autoApplyUsableCertificate() {
                if (this.usableCertificates().length !== 1) {
                    return;
                }
                const certificate = this.usableCertificates()[0];
                if (!this.shouldAutoApplyUsableCertificate(certificate)) {
                    return;
                }
                this.applyUsableCertificate(certificate, { auto: true });
            },
            formatUsableCertificateExpireAt(expireAt) {
                if (!expireAt) {
                    return '-';
                }
                const date = new Date(expireAt * 1000);
                if (Number.isNaN(date.getTime())) {
                    return '-';
                }
                return date.toISOString().slice(0, 10);
            },
            formatUsableCertificateSource(certificate) {
                if (!certificate) {
                    return '-';
                }
                if (certificate.mode === 'acme_http') {
                    return "Let's Encrypt";
                }
                if (certificate.mode === 'manual') {
                    return 'Manual';
                }
                return certificate.issuer || certificate.mode || '-';
            },
            async ensureUsableCertificates() {
                const vm = inModalApp || this;
                const cert = vm.currentTlsCertificate();
                if (!cert.useFile || !(this.inbound.tls || this.inbound.xtls)) {
                    return;
                }
                await vm.loadUsableCertificates(true);
            },
            streamNetworkChange(oldValue) {
                if (oldValue === 'kcp') {
                    this.inModal.inbound.tls = false;
                }
            },
            hasLegacyTransport(network) {
                return ['http', 'kcp', 'quic'].includes(network);
            },
            isLegacyRawHttpCamouflage() {
                return this.inbound.stream &&
                    this.inbound.stream.network === 'tcp' &&
                    this.inbound.stream.tcp &&
                    this.inbound.stream.tcp.type === 'http';
            }
        },
        watch: {
            'inModal.inbound.tls': async function(enabled) {
                if (enabled) {
                    this.ensureTlsCertificateModel();
                    await this.ensureUsableCertificates();
                }
            },
            'inModal.inbound.xtls': async function(enabled) {
                if (enabled) {
                    this.ensureTlsCertificateModel();
                    await this.ensureUsableCertificates();
                }
            },
            'inModal.inbound.stream.tls.certs[0].useFile': async function(useFile) {
                if (useFile && (this.inbound.tls || this.inbound.xtls)) {
                    await this.ensureUsableCertificates();
                }
            },
            'inModal.visible': function(visible) {
                if (visible) {
                    this.ensureSniffingModel();
                }
            }
        }
    });

</script>
{{end}}
