{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title" @ok="inModal.ok"
         :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    {{template "form/inbound"}}
</a-modal>
<script>
    let inModalApp = null;

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '确定',
        confirm: null,
        usableCertificates: [],
        usableCertificatesLoading: false,
        tlsAutoFillNotice: '',
        lastAutoAppliedCertFile: '',
        lastAutoAppliedKeyFile: '',
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            ObjectUtil.execute(inModal.confirm, inModal.inbound, inModal.dbInbound);
        },
        show({ title='', okText='确定', inbound=null, dbInbound=null, confirm=(inbound, dbInbound)=>{} }) {
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.usableCertificates = [];
            this.usableCertificatesLoading = false;
            this.tlsAutoFillNotice = '';
            this.lastAutoAppliedCertFile = '';
            this.lastAutoAppliedKeyFile = '';
            this.confirm = confirm;
            if (inModalApp) {
                inModalApp.ensureTlsCertificateModel();
            }
            this.visible = true;
            if (inModalApp && (this.inbound.tls || this.inbound.xtls)) {
                inModalApp.ensureUsableCertificates();
            }
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading) {
            inModal.confirmLoading = loading;
        },
    };

    const protocols = {
        VMESS: Protocols.VMESS,
        VLESS: Protocols.VLESS,
        SHADOWSOCKS: Protocols.SHADOWSOCKS,
        DOKODEMO: Protocols.DOKODEMO,
        SOCKS: Protocols.SOCKS,
        HTTP: Protocols.HTTP,
        MIXED: Protocols.MIXED,
        TUNNEL: Protocols.TUNNEL,
    };

    inModalApp = new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            Protocols: protocols,
            SSMethods: SSMethods,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            get protocolOptions() {
                if (inModal.inbound && inModal.inbound.protocol === Protocols.TROJAN) {
                    return {
                        ...protocols,
                        TROJAN: Protocols.TROJAN,
                    };
                }
                return protocols;
            }
        },
        methods: {
            ensureTlsCertificateModel() {
                if (!this.inbound.stream.tls) {
                    this.$set(this.inbound.stream, 'tls', new TlsStreamSettings());
                }
                if (!Array.isArray(this.inbound.stream.tls.certs)) {
                    this.$set(this.inbound.stream.tls, 'certs', []);
                }
                if (!this.inbound.stream.tls.certs[0]) {
                    this.$set(this.inbound.stream.tls.certs, 0, new TlsStreamSettings.Cert());
                }
                const cert = this.inbound.stream.tls.certs[0];
                if (typeof cert.useFile === 'undefined') {
                    this.$set(cert, 'useFile', true);
                }
                if (typeof cert.certFile === 'undefined') {
                    this.$set(cert, 'certFile', '');
                }
                if (typeof cert.keyFile === 'undefined') {
                    this.$set(cert, 'keyFile', '');
                }
                if (typeof cert.cert === 'undefined') {
                    this.$set(cert, 'cert', '');
                }
                if (typeof cert.key === 'undefined') {
                    this.$set(cert, 'key', '');
                }
                return cert;
            },
            currentTlsCertificate() {
                return this.ensureTlsCertificateModel();
            },
            usableCertificates() {
                return Array.isArray(this.inModal.usableCertificates) ? this.inModal.usableCertificates : [];
            },
            selectedUsableCertificate() {
                const cert = this.currentTlsCertificate();
                const certFile = String(cert.certFile || '').trim();
                const keyFile = String(cert.keyFile || '').trim();
                if (!certFile || !keyFile) {
                    return null;
                }
                return this.usableCertificates().find(item =>
                    String(item.certFile || '').trim() === certFile &&
                    String(item.keyFile || '').trim() === keyFile
                ) || null;
            },
            shouldShowUsableCertificateSelect() {
                const cert = this.currentTlsCertificate();
                return this.usableCertificates().length > 1 &&
                    cert.useFile &&
                    (this.inbound.tls || this.inbound.xtls);
            },
            hasTLSAutoFillNotice() {
                if (!this.inModal.tlsAutoFillNotice) {
                    return false;
                }
                const cert = this.currentTlsCertificate();
                return String(cert.certFile || '').trim() === this.inModal.lastAutoAppliedCertFile &&
                    String(cert.keyFile || '').trim() === this.inModal.lastAutoAppliedKeyFile;
            },
            shouldAutoApplyUsableCertificate(certificate) {
                if (!certificate) {
                    return false;
                }
                const cert = this.currentTlsCertificate();
                const currentCertFile = String(cert.certFile || '').trim();
                const currentKeyFile = String(cert.keyFile || '').trim();
                if (currentCertFile === '' && currentKeyFile === '') {
                    return true;
                }
                return currentCertFile === this.inModal.lastAutoAppliedCertFile &&
                    currentKeyFile === this.inModal.lastAutoAppliedKeyFile;
            },
            applyUsableCertificate(certificate, options={}) {
                if (!certificate) {
                    return;
                }
                const auto = !!options.auto;
                const cert = this.currentTlsCertificate();
                this.$set(cert, 'useFile', true);
                this.$set(cert, 'certFile', certificate.certFile || '');
                this.$set(cert, 'keyFile', certificate.keyFile || '');
                if (!String(this.inbound.stream.tls.server || '').trim() && String(certificate.domain || '').trim()) {
                    this.$set(this.inbound.stream.tls, 'server', certificate.domain);
                }
                if (auto) {
                    this.inModal.lastAutoAppliedCertFile = certificate.certFile;
                    this.inModal.lastAutoAppliedKeyFile = certificate.keyFile;
                    this.inModal.tlsAutoFillNotice = '已自动使用当前面板证书。';
                } else {
                    this.inModal.tlsAutoFillNotice = '';
                }
            },
            async loadUsableCertificates(autofill=false) {
                const cert = this.currentTlsCertificate();
                if (!cert.useFile || !(this.inbound.tls || this.inbound.xtls)) {
                    this.inModal.usableCertificates = [];
                    this.inModal.usableCertificatesLoading = false;
                    return;
                }
                this.inModal.usableCertificatesLoading = true;
                const msg = await HttpUtil.post('/xui/cert/listUsable');
                this.inModal.usableCertificatesLoading = false;
                if (!msg.success || !Array.isArray(msg.obj)) {
                    this.inModal.usableCertificates = [];
                    return;
                }
                this.inModal.usableCertificates = msg.obj;
                if (autofill) {
                    this.autoApplyUsableCertificate();
                }
            },
            applyUsableCertificateByID(id) {
                const certificate = this.usableCertificates().find(item => item.id === id);
                this.applyUsableCertificate(certificate, { auto: false });
            },
            autoApplyUsableCertificate() {
                if (this.usableCertificates().length !== 1) {
                    return;
                }
                const certificate = this.usableCertificates()[0];
                if (!this.shouldAutoApplyUsableCertificate(certificate)) {
                    return;
                }
                this.applyUsableCertificate(certificate, { auto: true });
            },
            formatUsableCertificateExpireAt(expireAt) {
                if (!expireAt) {
                    return '-';
                }
                const date = new Date(expireAt * 1000);
                if (Number.isNaN(date.getTime())) {
                    return '-';
                }
                return date.toISOString().slice(0, 10);
            },
            formatUsableCertificateSource(certificate) {
                if (!certificate) {
                    return '-';
                }
                if (certificate.mode === 'acme_http') {
                    return "Let's Encrypt";
                }
                if (certificate.mode === 'manual') {
                    return 'Manual';
                }
                return certificate.issuer || certificate.mode || '-';
            },
            async ensureUsableCertificates() {
                const cert = this.currentTlsCertificate();
                if (!cert.useFile || !(this.inbound.tls || this.inbound.xtls)) {
                    return;
                }
                await this.loadUsableCertificates(true);
            },
            streamNetworkChange(oldValue) {
                if (oldValue === 'kcp') {
                    this.inModal.inbound.tls = false;
                }
            }
        },
        watch: {
            'inModal.inbound.tls': async function(enabled) {
                if (enabled) {
                    this.ensureTlsCertificateModel();
                    await this.ensureUsableCertificates();
                }
            },
            'inModal.inbound.xtls': async function(enabled) {
                if (enabled) {
                    this.ensureTlsCertificateModel();
                    await this.ensureUsableCertificates();
                }
            },
            'inModal.inbound.stream.tls.certs[0].useFile': async function(useFile) {
                if (useFile && (this.inbound.tls || this.inbound.xtls)) {
                    await this.ensureUsableCertificates();
                }
            }
        }
    });

</script>
{{end}}
